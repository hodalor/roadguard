name: roadguard_mobile
description: RoadGuard Ghana mobile app starter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  firebase_auth: 5.7.0
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  flutter_contacts: 1.1.9+2
  flutter_dotenv: 5.2.1
  geolocator: 13.0.2
  http: 1.2.2
  image_picker: 1.1.2
  url_launcher: 6.3.1

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24
  geolocator_android: 4.5.5
  image_picker_android: 0.8.12+21
  url_launcher_android: 6.3.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
